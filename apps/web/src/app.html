<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- Home-screen launch: full screen, named "PT" (the full name truncates under the icon). -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="PT" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<!-- Link previews (LINE, Messenger): the app is a client-rendered shell, so crawlers see only
		     these. Keep them generic: never a member's name or token. No <title> here — pages set
		     their own and a second one would win over it. -->
		<meta name="description" content="Your training program from your coach. Opens without a password." />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Program Tracker" />
		<meta property="og:title" content="Program Tracker" />
		<meta property="og:description" content="Your training program from your coach. Opens without a password." />
		<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
		<script>
			// Resolve the theme before first paint (mirrors $lib/theme.svelte.ts).
			(function () {
				var p = null, lt = null, dt = null;
				try {
					p = localStorage.getItem('pt.theme');
					lt = localStorage.getItem('pt.theme.light');
					dt = localStorage.getItem('pt.theme.dark');
				} catch (e) {}
				var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				var light = ['light', 'light-hc', 'light-cb', 'paper'];
				var darks = ['dark', 'dark-dimmed', 'dark-hc', 'dark-cb'];
				var root = document.documentElement;
				root.dataset.theme = dark ? 'dark' : 'light';
				root.dataset.palette = dark
					? (darks.indexOf(dt) >= 0 ? dt : 'dark')
					: (light.indexOf(lt) >= 0 ? lt : 'light');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
