<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Resolve the theme before first paint (mirrors $lib/theme.svelte.ts).
			(function () {
				var p = null, lt = null, dt = null;
				try {
					p = localStorage.getItem('pt.theme');
					lt = localStorage.getItem('pt.theme.light');
					dt = localStorage.getItem('pt.theme.dark');
				} catch (e) {}
				var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
				var light = ['light', 'light-hc', 'light-cb', 'paper'];
				var darks = ['dark', 'dark-dimmed', 'dark-hc', 'dark-cb'];
				var root = document.documentElement;
				root.dataset.theme = dark ? 'dark' : 'light';
				root.dataset.palette = dark
					? (darks.indexOf(dt) >= 0 ? dt : 'dark')
					: (light.indexOf(lt) >= 0 ? lt : 'light');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
