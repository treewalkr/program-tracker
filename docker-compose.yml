# api and web reuse the image migrate builds — one build instead of three
x-app: &app
  image: program-tracker:local
  # tini as PID 1 forwards SIGTERM so containers stop in well under a second
  init: true
  pull_policy: never
  environment:
    DATABASE_URL: postgres://pt:pt_dev_password@postgres:5432/program_tracker
    # Calendar logic (week starts, "today", cardio deadlines) runs in local time.
    TZ: Asia/Bangkok

services:
  postgres:
    image: postgres:17-alpine
    container_name: pt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pt
      POSTGRES_PASSWORD: pt_dev_password
      POSTGRES_DB: program_tracker
    ports:
      - "5433:5432"
    volumes:
      - pt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pt -d program_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    build: .
    # migrate, then add any missing library exercises (idempotent)
    command: sh -c 'bun run --filter @pt/db migrate && bun run --filter @pt/db seed:exercises'
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    working_dir: /app/apps/api
    command: bun src/index.ts
    develop:
      # `docker compose watch` — code syncs in (bun.lock changes still need `up --build`)
      watch:
        - { action: sync+restart, path: ./apps/api/src, target: /app/apps/api/src }
        - { action: sync+restart, path: ./packages/db/src, target: /app/packages/db/src }
        - { action: sync+restart, path: ./packages/shared/src, target: /app/packages/shared/src }
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      # optional: root .env.local supplies provider keys (ZAI_API_KEY, DEEPSEEK_API_KEY) when present
      - path: .env.local
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    <<: *app
    # $env/static/public only picks up PUBLIC_* from apps/web/.env, so write it
    # before starting vite; PUBLIC_API_URL must be host-reachable (published port),
    # not the docker-internal service name.
    working_dir: /app/apps/web
    command: >-
      sh -c 'printf "PUBLIC_API_URL=http://localhost:4000\nPUBLIC_API_MODE=live\n" > .env
      && exec bun --bun vite dev --host 0.0.0.0 --port 5173 --strictPort'
    develop:
      # vite HMR picks up synced files; no restart needed
      watch:
        - { action: sync, path: ./apps/web/src, target: /app/apps/web/src }
        - { action: sync, path: ./apps/web/static, target: /app/apps/web/static }
        - { action: sync, path: ./packages/shared/src, target: /app/packages/shared/src }
    environment:
      TZ: Asia/Bangkok
      # browser calls /v1 same-origin; vite proxies it to the api service
      API_PROXY_TARGET: http://api:4000
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pt-pgdata:
