name: Nightly database backup

# Deploys already back up before migrating (ci.yml), but a quiet month would let every
# backup expire. This runs every night whether or not anything shipped, with the same
# encrypted dump (scripts/deploy/db-backup.sh, readable only with the owner's age key),
# stored only in the private R2 bucket (never a GitHub artifact: the repo is public).
# Restore: docs/deploy.md › Database backups.
on:
  schedule:
    - cron: "17 19 * * *" # 02:17 in Bangkok
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    # DATABASE_URL and CLOUDFLARE_ACCOUNT_ID live in the production environment; the R2 keys are repo secrets.
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Back up database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          mkdir -p "$RUNNER_TEMP/db-backup"
          scripts/deploy/db-backup.sh "$RUNNER_TEMP/db-backup/db-nightly-$(date -u +%Y%m%d-%H%M).dump.age"

      - name: Copy to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy/r2-upload.sh "$RUNNER_TEMP"/db-backup/*.dump.age nightly
