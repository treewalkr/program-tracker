name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt_dev_password
          POSTGRES_DB: program_tracker_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pt" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pt:pt_dev_password@localhost:5433/program_tracker_test
      PUBLIC_API_MODE: mock
      PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the last step reads the commits since the previous release tag.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      # Schema first: Render deploys the API only after these checks pass.
      - name: Migrate Supabase
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run src/migrate.ts && bun run seed:exercises

      - name: Build web
        working-directory: apps/web
        env:
          PUBLIC_API_MODE: live
          PUBLIC_API_URL: https://pt.pinroj.com
        run: bun run build

      - name: Deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 deploy

      # Render isn't wired to GitHub webhooks; deploy this exact commit after migrations.
      - name: Deploy API (Render)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbngf267bikc73cg2hg0
        run: |
          id=$(curl -fsS -X POST -H "Authorization: Bearer $RENDER_API_KEY" -H "content-type: application/json" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" -d "{\"commitId\":\"$GITHUB_SHA\"}" | jq -r .id)
          echo "render deploy $id"
          for i in $(seq 1 60); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$id" | jq -r .status)
            echo "$status"
            case "$status" in live) exit 0;; build_failed|update_failed|canceled|deactivated) exit 1;; esac
            sleep 15
          done
          exit 1

      # The API is live: close the feedback tickets these commits name (FB-012).
      # Never fails the deploy; without the secret it only prints a notice.
      - name: Close shipped feedback tickets
        continue-on-error: true
        env:
          PT_API_URL: https://pt.pinroj.com
          FEEDBACK_AGENT_TOKEN: ${{ secrets.FEEDBACK_AGENT_TOKEN }}
        run: bun run apps/api/scripts/feedback-shipped.ts
