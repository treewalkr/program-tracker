name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt_dev_password
          POSTGRES_DB: program_tracker_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pt" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pt:pt_dev_password@localhost:5433/program_tracker_test
      PUBLIC_API_MODE: mock
      PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the guards step below walks the commits this push or PR adds,
          # and floors the range at the guards-v1 tag.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

      # Git hooks can be skipped (--no-verify, another agent); this can't. Re-checks the commit
      # messages and re-runs the red proofs of the commits added here, so a bad commit on main
      # stops the deploy. Warn-only until the guards-v1 tag exists; never looks before it.
      # Rules and exemptions: scripts/guards/README.md.
      - name: Verify commit messages and red proofs
        env:
          GUARDS_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          GUARDS_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/guards/verify-range.ts "$GUARDS_BASE" "$GUARDS_HEAD"

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RENDER_SERVICE_ID: srv-dbngf267bikc73cg2hg0
      # Render API (custom domain), as in apps/web/wrangler.jsonc (API_ORIGIN)
      API_ORIGIN: https://api.pt.pinroj.com
      SITE_URL: https://pt.pinroj.com
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the last step reads the commits since the previous release tag.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      # Build first: a broken web build stops the deploy before anything in production changes.
      - name: Build web
        working-directory: apps/web
        env:
          PUBLIC_API_MODE: live
          PUBLIC_API_URL: https://pt.pinroj.com
        run: bun run build

      # What's serving now, so a failed deploy can be rolled back to exactly this.
      - name: Record live versions
        id: before
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          live=$(scripts/deploy/render.sh live)
          read -r deploy commit <<< "$live"
          worker=$(scripts/deploy/worker.sh version)
          echo "API: Render deploy $deploy (${commit:0:7}); web: Worker version $worker"
          { echo "render_deploy=$deploy"; echo "render_commit=$commit"; echo "worker_version=$worker"; } >> "$GITHUB_OUTPUT"

      # Restore point before migrating. Encrypted to .github/backup-age.pub (the repo is
      # public); a failed dump stops the deploy here. Restore: docs/deploy.md.
      - name: Back up database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          mkdir -p "$RUNNER_TEMP/db-backup"
          scripts/deploy/db-backup.sh "$RUNNER_TEMP/db-backup/db-backup-$GITHUB_SHA.dump.age"

      # A failed copy stops the deploy, like a failed dump: no migration without a restore point.
      - name: Copy backup to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy/r2-upload.sh "$RUNNER_TEMP/db-backup/db-backup-$GITHUB_SHA.dump.age" deploy

      # Schema first. Migrations are expand-only (packages/db/src/migration-lint.ts), so the
      # API and web still running from the previous release keep working against it.
      - name: Migrate Supabase
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run src/migrate.ts && bun run seed:exercises

      # API before web: the API stays compatible with the previous web build, but a new
      # web build may call routes the previous API doesn't have.
      # Render isn't wired to GitHub webhooks; deploy this exact commit.
      - name: Deploy API (Render)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          id=$(scripts/deploy/render.sh deploy "$GITHUB_SHA")
          scripts/deploy/render.sh wait "$id"

      - name: Smoke test API
        run: scripts/deploy/smoke.sh api "$GITHUB_SHA"

      - name: Deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 deploy

      - name: Smoke test site
        run: scripts/deploy/smoke.sh site "$GITHUB_SHA"

      # A step after "Record live versions" failed: put back whatever this run changed, then
      # fail. A Render build that failed changed nothing (the old instance kept serving).
      # Migrations stay applied — they're expand-only, so the previous release runs on them.
      - name: Roll back after a failed deploy
        if: failure() && steps.before.outcome == 'success'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDER_BEFORE: ${{ steps.before.outputs.render_deploy }}
          RENDER_BEFORE_COMMIT: ${{ steps.before.outputs.render_commit }}
          WORKER_BEFORE: ${{ steps.before.outputs.worker_version }}
        run: |
          live=$(scripts/deploy/render.sh live)
          read -r _ commit <<< "$live"
          if [ "$commit" != "$RENDER_BEFORE_COMMIT" ]; then
            id=$(scripts/deploy/render.sh rollback "$RENDER_BEFORE")
            scripts/deploy/render.sh wait "$id"
          else
            echo "API: unchanged, still ${commit:0:7}"
          fi
          if [ "$(scripts/deploy/worker.sh version)" != "$WORKER_BEFORE" ]; then
            scripts/deploy/worker.sh rollback "$WORKER_BEFORE" "auto-rollback: deploy of ${GITHUB_SHA:0:7} failed its smoke test"
          else
            echo "web: unchanged, still $WORKER_BEFORE"
          fi
          scripts/deploy/smoke.sh api "$RENDER_BEFORE_COMMIT" || echo "::error::The API still fails after rolling back — check Render now."
          echo "::error::Deploy of ${GITHUB_SHA:0:7} failed; production is back on ${RENDER_BEFORE_COMMIT:0:7} (Render $RENDER_BEFORE, Worker $WORKER_BEFORE). Migrations stay applied. The first failed step above says why."
          exit 1

      # Everything is live and answering: close the feedback tickets these commits name
      # (FB-012). Never fails the deploy; without the secret it only prints a notice.
      - name: Close shipped feedback tickets
        continue-on-error: true
        env:
          PT_API_URL: https://pt.pinroj.com
          FEEDBACK_AGENT_TOKEN: ${{ secrets.FEEDBACK_AGENT_TOKEN }}
        run: bun run apps/api/scripts/feedback-shipped.ts
