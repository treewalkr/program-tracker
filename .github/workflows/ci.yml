name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt_dev_password
          POSTGRES_DB: program_tracker_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pt" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pt:pt_dev_password@localhost:5433/program_tracker_test
      PUBLIC_API_MODE: mock
      PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RENDER_SERVICE_ID: srv-dbngf267bikc73cg2hg0
      # Render origin, as in apps/web/wrangler.jsonc (API_ORIGIN)
      API_ORIGIN: https://program-tracker-api.onrender.com
      SITE_URL: https://pt.pinroj.com
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the last step reads the commits since the previous release tag.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      # Build first: a broken web build stops the deploy before anything in production changes.
      - name: Build web
        working-directory: apps/web
        env:
          PUBLIC_API_MODE: live
          PUBLIC_API_URL: https://pt.pinroj.com
        run: bun run build

      # Restore point before migrating. Encrypted to .github/backup-age.pub (the repo is
      # public); a failed dump stops the deploy here. Restore: docs/deploy.md.
      - name: Back up database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null
          mkdir -p "$RUNNER_TEMP/db-backup"
          scripts/deploy/db-backup.sh "$RUNNER_TEMP/db-backup/db-backup-$GITHUB_SHA.dump.age"

      - name: Upload backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.sha }}
          path: ${{ runner.temp }}/db-backup/
          retention-days: 30
          if-no-files-found: error

      # Schema first. Migrations are expand-only (packages/db/src/migration-lint.ts), so the
      # API and web still running from the previous release keep working against it.
      - name: Migrate Supabase
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run src/migrate.ts && bun run seed:exercises

      # API before web: the API stays compatible with the previous web build, but a new
      # web build may call routes the previous API doesn't have.
      # Render isn't wired to GitHub webhooks; deploy this exact commit.
      - name: Deploy API (Render)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          id=$(scripts/deploy/render.sh deploy "$GITHUB_SHA")
          scripts/deploy/render.sh wait "$id"

      - name: Smoke test API
        run: scripts/deploy/smoke.sh api "$GITHUB_SHA"

      - name: Deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 deploy

      - name: Smoke test site
        run: scripts/deploy/smoke.sh site "$GITHUB_SHA"

      # Everything is live and answering: close the feedback tickets these commits name
      # (FB-012). Never fails the deploy; without the secret it only prints a notice.
      - name: Close shipped feedback tickets
        continue-on-error: true
        env:
          PT_API_URL: https://pt.pinroj.com
          FEEDBACK_AGENT_TOKEN: ${{ secrets.FEEDBACK_AGENT_TOKEN }}
        run: bun run apps/api/scripts/feedback-shipped.ts
