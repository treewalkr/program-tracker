name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pt
          POSTGRES_PASSWORD: pt_dev_password
          POSTGRES_DB: program_tracker_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pt" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://pt:pt_dev_password@localhost:5433/program_tracker_test
      PUBLIC_API_MODE: mock
      PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run --filter @pt/web check

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile

      # Schema first: Render deploys the API only after these checks pass.
      - name: Migrate Supabase
        working-directory: packages/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run src/migrate.ts && bun run seed:exercises

      - name: Build web
        working-directory: apps/web
        env:
          PUBLIC_API_MODE: live
          PUBLIC_API_URL: https://pt.pinroj.com
        run: bun run build

      - name: Deploy Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4 deploy
